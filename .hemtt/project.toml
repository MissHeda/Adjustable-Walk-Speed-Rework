name = "Adjustable Walking Speed - Rework"
prefix = "awsr"
author = "Miss Heda"
mainprefix = "z"

[files]
include = [
    "mod.cpp",
    "LICENSE.txt",
    "logo.paa",
]

[version]
git_hash = 0

[hemtt.config]
preset = "Hemtt"

# Mods loaded alongside for testing. `hemtt launch` already sets -skipIntro -noSplash
# -showScriptErrors -debug and file patching by itself.
#
# Machine-specific things - an Arma profile, a custom mod folder - go on the command line
# instead of in here, so the repo stays the same for everyone:
#
#   hemtt launch -- -name="Mia"
[hemtt.launch]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "2369477168", # Advanced Developer Tools
]
